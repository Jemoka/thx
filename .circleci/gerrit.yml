version: 2.1

parameters:
  revision:
    type: string
    default: ""
  refspec:
    type: string
    default: ""
  change:
    type: string
    default: ""
  patchset:
    type: string
    default: ""
  rerun:
    type: boolean
    default: false

jobs:
  gerrit-ci:
    docker:
      - image: cimg/python:3.12
    environment:
      GERRIT_REVISION: << pipeline.parameters.revision >>
      GERRIT_REFSPEC: << pipeline.parameters.refspec >>
      GERRIT_CHANGE: "<< pipeline.parameters.change >>"
      GERRIT_PATCHSET: "<< pipeline.parameters.patchset >>"
      GERRIT_RERUN: "<< pipeline.parameters.rerun >>"

    steps:
      - run:
          name: Skip completed Gerrit patch sets
          command: |
            if [ "$GERRIT_RERUN" = true ]; then
              echo "Explicit rerun requested."
              exit 0
            fi

            echo "Resolving the Gerrit CI account."
            curl --fail-with-body --silent --show-error \
              --user "$GERRIT_USER:$GERRIT_HTTP_PASSWORD" \
              https://review.gerrithub.io/a/accounts/self \
              > /tmp/gerrit-account.json || { cat /tmp/gerrit-account.json; exit 1; }
            account=$(sed '1d' /tmp/gerrit-account.json | jq -er '._account_id | numbers')
            echo "Checking change $GERRIT_CHANGE, patch set $GERRIT_PATCHSET as account $account."
            curl --fail-with-body --silent --show-error \
              --user "$GERRIT_USER:$GERRIT_HTTP_PASSWORD" \
              "https://review.gerrithub.io/a/changes/${GERRIT_CHANGE}/messages" \
              > /tmp/gerrit-messages-response.json || { cat /tmp/gerrit-messages-response.json; exit 1; }
            sed '1d' /tmp/gerrit-messages-response.json > /tmp/gerrit-messages.json
            completed=$(jq -r --argjson account "$account" \
              --argjson patchset "$GERRIT_PATCHSET" '
                any(.[];
                  .author._account_id == $account and
                  ._revision_number == $patchset and
                  .tag == "autogenerated:circleci" and
                  (.message | test("CircleCI (passed|failed)\\.")))
              ' /tmp/gerrit-messages.json)
            if [ "$completed" = true ]; then
              echo "CI already completed for change $GERRIT_CHANGE, patch set $GERRIT_PATCHSET."
              circleci-agent step halt
            fi

      - run:
          name: Checkout Gerrit patch set
          command: |
            git init .

            git remote add gerrit \
              "https://${GERRIT_USER}:${GERRIT_HTTP_PASSWORD}@review.gerrithub.io/Jemoka/theseus"

            git fetch gerrit "$GERRIT_REFSPEC"
            git checkout FETCH_HEAD

      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

      - run:
          name: Install dependencies
          command: |
            uv sync --no-default-groups --group dev

      - run:
          name: Run pre-commit
          command: |
            set +e

            uv run pre-commit run --all-files
            result=$?
            set -e

            if [ "$result" -eq 0 ]; then
              vote=1
              message="CircleCI passed."
            else
              vote=-1
              message="CircleCI failed."
            fi

            curl --fail \
              --user "$GERRIT_USER:$GERRIT_HTTP_PASSWORD" \
              -H "Content-Type: application/json" \
              -X POST \
              -d "{
                \"tag\": \"autogenerated:circleci\",
                \"message\": \"$message\",
                \"labels\": {
                  \"Verified\": $vote
                }
              }" \
              "https://review.gerrithub.io/a/changes/${GERRIT_CHANGE}/revisions/${GERRIT_REVISION}/review"

            exit "$result"

workflows:
  gerrit:
    jobs:
      - gerrit-ci:
          # Keep the result check and vote under one lock for this patch set.
          serial-group: << pipeline.project.slug >>/gerrit/<< pipeline.parameters.change >>/<< pipeline.parameters.revision >>
